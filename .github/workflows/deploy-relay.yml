name: Deploy the relay

# Only when the relay itself changes. The game is a static site on Pages and has
# its own workflow; the two deploy independently, which is deliberate — a broken
# relay must never be able to stop the children loading the meadow.
on:
  push:
    branches: [claude/unicorn-game-build-88xv4l]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-relay.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Lets the job ask GitHub for a short-lived OIDC token, which is what it
  # trades for Azure access. No publish profile and no stored password.
  id-token: write

# Two deploys at once would fight over the same app. Queue rather than cancel,
# so the last push is what ends up running.
concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_NAME: app-unicorngame-prod-001
      RESOURCE_GROUP: rg-unicorngame-prod-001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Production dependencies only: the relay needs `ws` and nothing else, and
      # App Service is told not to build again on its side.
      - name: Install
        working-directory: server
        run: npm ci --omit=dev

      - name: Check it parses
        working-directory: server
        run: |
          node --check relay.js
          node --check meadow.js

      # A quick proof it actually starts and serves, so a syntax-clean but
      # broken relay does not get as far as the children.
      - name: Smoke test
        working-directory: server
        run: |
          PORT=8080 ANGEN_DATA_DIR=./ci-data node relay.js &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/healthz > /dev/null; then
              echo "relay is up:"
              curl -s http://localhost:8080/healthz
              exit 0
            fi
            sleep 0.5
          done
          echo "relay did not come up" >&2
          exit 1

      # Federated credentials: GitHub proves who it is, Azure hands back a token
      # that expires in minutes. Nothing long-lived is stored in the repository,
      # so there is no publish profile to leak or to remember to rotate.
      #
      # If this step fails with something about the subject or the audience, the
      # federated credential on the Azure side does not match what this run
      # sends. A run on a branch sends `repo:<owner>/<repo>:ref:refs/heads/<branch>`;
      # if the credential was set up against an *environment* instead, add
      # `environment: <name>` to this job so the claim matches.
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # App Service no longer gives every app a plain <name>.azurewebsites.net;
      # newer ones get a regional hostname with a random middle. Asking Azure is
      # the only way to be right about it.
      - name: Find the hostname
        id: host
        run: |
          HOST=$(az webapp show \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query defaultHostName -o tsv)
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "relay is at wss://$HOST/angen"

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          package: server

      # The relay is the one piece that can be down without anybody noticing
      # until a child tries to play, so the deploy is not finished until it has
      # answered for itself.
      - name: Wait for it to answer
        run: |
          HOST='${{ steps.host.outputs.host }}'
          for i in $(seq 1 30); do
            if curl -sf "https://$HOST/healthz"; then
              echo
              echo "relay is live at wss://$HOST/angen"
              exit 0
            fi
            sleep 5
          done
          echo "relay did not answer after the deploy" >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "### Relay" >> "$GITHUB_STEP_SUMMARY"
          echo '`VITE_ANGEN_RELAY` should be:' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "wss://${{ steps.host.outputs.host }}/angen" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
