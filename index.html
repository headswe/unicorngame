<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#bfe3f2" />
    <meta name="description" content="Ett litet spel om enhörningar på en äng." />
    <!-- Added to a tablet home screen, this opens without browser chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Enhörningsängen" />
    <title>Enhörningsängen</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🦄</text></svg>" />
    <style>
      :root {
        color-scheme: light;
        --ink: #4a3327;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #bfe3f2;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .hud {
        position: fixed;
        inset: auto 0 0 0;
        padding: 0.9rem clamp(0.8rem, 3vw, 2rem) calc(0.9rem + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        pointer-events: none;
      }
      .hud-card {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.4rem 0.5rem 0.4rem 1rem;
        background: rgba(255, 255, 255, 0.88);
        border: 3px solid var(--ink);
        border-radius: 999px;
        box-shadow: 0 6px 0 rgba(74, 51, 39, 0.18);
        pointer-events: auto;
      }
      .hud-name {
        font-size: 1.15rem;
        font-weight: bold;
        max-width: 40vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hud-button {
        font: inherit;
        font-weight: bold;
        font-size: 1rem;
        color: var(--ink);
        padding: 0.55rem 1.1rem;
        min-height: 2.9rem;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: #ffe07a;
        cursor: pointer;
        transition: transform 0.12s ease, background 0.12s ease;
      }
      .hud-button:hover {
        background: #ffd147;
      }
      .hud-button:active {
        transform: translateY(2px) scale(0.97);
      }
      .hud-button:focus-visible {
        outline: 3px solid #2f6fb5;
        outline-offset: 3px;
      }
      .hud-icon {
        font-size: 1.2rem;
        line-height: 1;
        width: 2.9rem;
        height: 2.9rem;
        display: grid;
        place-items: center;
        border: 3px solid var(--ink);
        border-radius: 50%;
        background: #cfe9dd;
        cursor: pointer;
        transition: transform 0.12s ease, background 0.12s ease;
      }
      .hud-icon:hover {
        background: #b9e0cf;
      }
      .hud-icon:active {
        transform: translateY(2px) scale(0.97);
      }
      .hud-icon:focus-visible {
        outline: 3px solid #2f6fb5;
        outline-offset: 3px;
      }
      .hud-spell {
        background: #ffd9f0;
      }
      .hud-spell:hover {
        background: #ffc2e6;
      }
      .hud-abc {
        background: #ffe9c9;
      }
      .hud-abc:hover {
        background: #ffdca3;
      }
      .hud-icon.off {
        background: #e6e0da;
        opacity: 0.75;
      }
      .hud-tally {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 1.1rem;
        font-weight: bold;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        background: #ffe9c9;
        border: 2px solid var(--ink);
        transition: transform 0.15s ease;
      }
      .hud-tally[hidden] {
        display: none;
      }
      .hud-tally.pop {
        animation: tally-pop 0.35s ease;
      }
      @keyframes tally-pop {
        40% {
          transform: scale(1.28) rotate(-4deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hud-tally.pop {
          animation: none;
        }
      }
      .hud-hint {
        margin: 0;
        font-size: 0.9rem;
        font-weight: bold;
        color: #3f5d4f;
        background: rgba(255, 255, 255, 0.72);
        padding: 0.3rem 0.9rem;
        border-radius: 999px;
        transition: opacity 0.6s ease;
      }
      .hud-hint.gone {
        opacity: 0;
      }
      .spell {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: rgba(40, 62, 54, 0.55);
        backdrop-filter: blur(3px);
        padding: 1rem;
      }
      .spell[hidden] {
        display: none;
      }
      .spell-panel {
        position: relative;
        background: linear-gradient(#fffaf2, #f2f7ef);
        border: 4px solid var(--ink);
        border-radius: 1.6rem;
        box-shadow: 0 10px 0 rgba(74, 51, 39, 0.22);
        padding: 1.2rem clamp(1rem, 4vw, 2rem) 1.4rem;
        max-width: min(94vw, 40rem);
        max-height: 94vh;
        overflow: auto;
        text-align: center;
      }
      .spell-close {
        position: absolute;
        top: 0.6rem;
        right: 0.6rem;
        width: 2.6rem;
        height: 2.6rem;
        font: inherit;
        font-size: 1.1rem;
        color: var(--ink);
        background: #ffd9e0;
        border: 3px solid var(--ink);
        border-radius: 50%;
        cursor: pointer;
      }
      .spell-title {
        margin: 0.2rem 0 0.9rem;
        font-size: clamp(1.3rem, 4vw, 1.8rem);
      }
      .spell-picker {
        display: flex;
        flex-wrap: wrap;
        gap: 0.9rem;
        justify-content: center;
      }
      /* `hidden` alone loses to `display: flex`, so it has to be spelled out. */
      .spell-picker[hidden] {
        display: none;
      }
      .spell-card {
        font: inherit;
        color: var(--ink);
        width: min(15rem, 40vw);
        display: grid;
        gap: 0.3rem;
        padding: 1rem 0.8rem;
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 1.1rem;
        cursor: pointer;
        transition: transform 0.12s ease, background 0.12s ease;
      }
      .spell-card:hover {
        background: #fff3d6;
        transform: translateY(-2px);
      }
      .spell-card:active {
        transform: translateY(2px) scale(0.98);
      }
      .spell-card-icon {
        font-size: 2.6rem;
        line-height: 1;
      }
      .spell-card-name {
        font-weight: bold;
        font-size: 1.15rem;
      }
      .spell-card-desc {
        font-size: 0.85rem;
        color: #5d6f63;
      }
      .spell-canvas {
        width: min(70vw, 52vh);
        height: min(70vw, 52vh);
        touch-action: none;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.7);
        border: 3px dashed rgba(74, 51, 39, 0.25);
        cursor: crosshair;
      }
      .spell-draw.shake {
        animation: spell-shake 0.4s ease;
      }
      .spell-draw.cast .spell-canvas {
        animation: spell-cast 0.5s ease forwards;
      }
      @keyframes spell-shake {
        20% { transform: translateX(-10px); }
        45% { transform: translateX(9px); }
        70% { transform: translateX(-5px); }
      }
      @keyframes spell-cast {
        to {
          transform: scale(1.12);
          opacity: 0;
        }
      }
      .spell-status {
        margin: 0.9rem 0 0;
        min-height: 1.4rem;
        font-weight: bold;
        font-size: 1.05rem;
      }
      @media (prefers-reduced-motion: reduce) {
        .spell-draw.shake,
        .spell-draw.cast .spell-canvas {
          animation: none;
        }
      }
      .wardrobe {
        position: fixed;
        inset: 0;
        z-index: 25;
        display: grid;
        place-items: center;
        background: rgba(40, 62, 54, 0.55);
        backdrop-filter: blur(3px);
        padding: 0.6rem;
      }
      .wardrobe[hidden] {
        display: none;
      }
      .wardrobe-panel {
        display: flex;
        gap: 1rem;
        align-items: stretch;
        background: linear-gradient(#fffaf2, #f2f7ef);
        border: 4px solid var(--ink);
        border-radius: 1.6rem;
        box-shadow: 0 10px 0 rgba(74, 51, 39, 0.22);
        padding: 1rem;
        max-width: min(96vw, 56rem);
        max-height: 96vh;
      }
      .wardrobe-stage {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        align-items: center;
        flex: 0 0 auto;
      }
      .wardrobe-canvas {
        width: clamp(9rem, 26vw, 15rem);
        height: clamp(10rem, 30vw, 17rem);
        background: radial-gradient(circle at 50% 62%, #dff0e4, #bfe3f2);
        border: 3px solid var(--ink);
        border-radius: 1.1rem;
      }
      .wardrobe-namerow {
        display: flex;
        gap: 0.4rem;
        align-items: center;
      }
      .wardrobe-name {
        font: inherit;
        font-weight: bold;
        font-size: 1rem;
        color: var(--ink);
        width: 7.5rem;
        text-align: center;
        padding: 0.45rem 0.5rem;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: #fff;
      }
      .wardrobe-dice {
        font-size: 1.2rem;
        width: 2.7rem;
        height: 2.7rem;
        border: 3px solid var(--ink);
        border-radius: 50%;
        background: #ffe07a;
        cursor: pointer;
      }
      .wardrobe-done {
        font: inherit;
        font-weight: bold;
        font-size: 1.15rem;
        color: var(--ink);
        width: 100%;
        padding: 0.6rem 1rem;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: #8fe0c0;
        cursor: pointer;
      }
      .wardrobe-done:active,
      .wardrobe-dice:active {
        transform: translateY(2px) scale(0.98);
      }
      .wardrobe-picker {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        min-width: 0;
        flex: 1 1 auto;
      }
      .wardrobe-tabs {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
      }
      .wardrobe-tab {
        font: inherit;
        font-size: 0.85rem;
        font-weight: bold;
        color: var(--ink);
        display: grid;
        justify-items: center;
        gap: 0.1rem;
        padding: 0.4rem 0.7rem;
        border: 3px solid var(--ink);
        border-radius: 0.9rem;
        background: #fff;
        cursor: pointer;
      }
      .wardrobe-tab span:first-child {
        font-size: 1.2rem;
        line-height: 1;
      }
      .wardrobe-tab.active {
        background: #ffe07a;
      }
      .wardrobe-options {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(5.2rem, 1fr));
        gap: 0.5rem;
        overflow-y: auto;
        padding: 0.2rem;
        min-height: 6rem;
        max-height: min(38vh, 16rem);
      }
      .wardrobe-option {
        font: inherit;
        font-size: 0.75rem;
        font-weight: bold;
        color: var(--ink);
        display: grid;
        justify-items: center;
        gap: 0.2rem;
        padding: 0.4rem 0.2rem;
        background: #fff;
        border: 3px solid rgba(74, 51, 39, 0.25);
        border-radius: 0.8rem;
        cursor: pointer;
      }
      .wardrobe-option img {
        width: 3.2rem;
        height: 3.2rem;
        object-fit: contain;
      }
      .wardrobe-none {
        font-size: 2rem;
        line-height: 3.2rem;
        height: 3.2rem;
        color: rgba(74, 51, 39, 0.4);
      }
      .wardrobe-option.selected {
        border-color: var(--ink);
        background: #fff3d6;
      }
      .wardrobe-swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        justify-content: center;
      }
      .wardrobe-swatch {
        width: 2.2rem;
        height: 2.2rem;
        border: 3px solid rgba(74, 51, 39, 0.3);
        border-radius: 50%;
        cursor: pointer;
        padding: 0;
      }
      .wardrobe-swatch.selected {
        border-color: var(--ink);
        transform: scale(1.14);
      }
      /* Narrow screens stack the stage above the shelves. */
      @media (max-width: 40rem), (orientation: portrait) {
        .wardrobe-panel {
          flex-direction: column;
          gap: 0.6rem;
          overflow-y: auto;
        }
        .wardrobe-canvas {
          width: 60vw;
          height: 34vh;
        }
      }
      .spelling {
        position: fixed;
        inset: 0;
        z-index: 22;
        display: grid;
        place-items: center;
        background: rgba(40, 62, 54, 0.55);
        backdrop-filter: blur(3px);
        padding: 0.6rem;
      }
      .spelling[hidden] {
        display: none;
      }
      .spelling-panel {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7rem;
        background: linear-gradient(#fffaf2, #f2f7ef);
        border: 4px solid var(--ink);
        border-radius: 1.6rem;
        box-shadow: 0 10px 0 rgba(74, 51, 39, 0.22);
        padding: 1rem clamp(0.8rem, 3vw, 2rem) 1.2rem;
        max-width: min(96vw, 46rem);
        max-height: 96vh;
        overflow-y: auto;
      }
      .spelling-close {
        position: absolute;
        top: 0.6rem;
        right: 0.6rem;
        width: 2.6rem;
        height: 2.6rem;
        font: inherit;
        font-size: 1.1rem;
        color: var(--ink);
        background: #ffd9e0;
        border: 3px solid var(--ink);
        border-radius: 50%;
        cursor: pointer;
      }
      .spelling-levels {
        display: flex;
        gap: 0.4rem;
      }
      .spelling-level {
        font: inherit;
        font-size: 0.8rem;
        font-weight: bold;
        color: var(--ink);
        display: grid;
        justify-items: center;
        padding: 0.35rem 0.7rem;
        border: 3px solid var(--ink);
        border-radius: 0.9rem;
        background: #fff;
        cursor: pointer;
      }
      .spelling-level span:first-child {
        font-size: 1.1rem;
        line-height: 1.2;
      }
      .spelling-level.active {
        background: #ffe07a;
      }
      .spelling-picture {
        width: clamp(6rem, 22vw, 9rem);
        height: clamp(6rem, 22vw, 9rem);
        object-fit: contain;
        background: radial-gradient(circle at 50% 60%, #dff0e4, #cfe9dd);
        border: 3px solid var(--ink);
        border-radius: 1.1rem;
        padding: 0.4rem;
      }
      .spelling-slots,
      .spelling-tray {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        justify-content: center;
        min-height: 3.6rem;
      }
      .spelling-tray {
        padding: 0.5rem;
        border: 3px dashed rgba(74, 51, 39, 0.28);
        border-radius: 1rem;
        min-width: min(80vw, 24rem);
      }
      .spelling-slot {
        min-width: 3rem;
        height: 3.4rem;
        display: grid;
        place-items: center;
        padding: 0 0.15rem;
        border: 3px dashed rgba(74, 51, 39, 0.35);
        border-radius: 0.7rem;
        background: rgba(255, 255, 255, 0.6);
      }
      .spelling-slot.given {
        border-style: solid;
        background: #eef4ec;
      }
      .spelling-tile {
        font: inherit;
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--ink);
        min-width: 2.6rem;
        height: 3rem;
        padding: 0 0.5rem;
        display: grid;
        place-items: center;
        background: #ffe07a;
        border: 3px solid var(--ink);
        border-radius: 0.6rem;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      .spelling-tile.fixed {
        background: #cfe9dd;
        cursor: default;
      }
      .spelling-tile.dragging {
        cursor: grabbing;
        z-index: 5;
        position: relative;
        box-shadow: 0 6px 12px rgba(74, 51, 39, 0.3);
      }
      .spelling-gap {
        min-width: 2.6rem;
        height: 3rem;
        border-radius: 0.6rem;
        background: rgba(74, 51, 39, 0.06);
      }
      .spelling-slots.shake {
        animation: spell-shake 0.4s ease;
      }
      .spelling-slots.correct .spelling-tile {
        background: #8fe0c0;
      }
      .spelling-slots.correct {
        animation: tally-pop 0.5s ease;
      }
      .spelling-status {
        margin: 0;
        min-height: 1.4rem;
        font-weight: bold;
        text-align: center;
      }
      .spelling-footer {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .spelling-score {
        font-size: 1.2rem;
        font-weight: bold;
      }
      .spelling-next {
        font: inherit;
        font-weight: bold;
        color: var(--ink);
        padding: 0.5rem 1.1rem;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: #8fe0c0;
        cursor: pointer;
      }
      @media (prefers-reduced-motion: reduce) {
        .spelling-slots.shake,
        .spelling-slots.correct {
          animation: none;
        }
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.2rem;
        background: linear-gradient(#bfe3f2, #dff0e4);
        z-index: 10;
        transition: opacity 0.5s ease;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading .horn {
        font-size: 4rem;
        animation: bob 1.4s ease-in-out infinite;
      }
      #loading p {
        margin: 0;
        font-size: 1.4rem;
        font-weight: bold;
        letter-spacing: 0.02em;
      }
      #loading .bar {
        width: min(60vw, 18rem);
        height: 0.9rem;
        border: 3px solid var(--ink);
        border-radius: 999px;
        overflow: hidden;
        background: #fff;
      }
      #loading .bar span {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #ff9ec7, #ffd479, #8fe0c0, #9ec8ff);
        transition: width 0.25s ease;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0) rotate(-6deg);
        }
        50% {
          transform: translateY(-12px) rotate(6deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .horn {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">
      <div class="horn">🦄</div>
      <p>Ängen växer fram…</p>
      <div class="bar"><span id="loading-bar"></span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
