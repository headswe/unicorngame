<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#bfe3f2" />
    <meta name="description" content="Ett litet spel om enhörningar på en äng." />
    <!-- Added to a tablet home screen, this opens without browser chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Enhörningsängen" />
    <title>Enhörningsängen</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🦄</text></svg>" />
    <style>
      :root {
        color-scheme: light;
        --ink: #4a3327;
        /* The bottom row: the arrows on the left, the magic button on the
           right, and the hint line kept clear above both. */
        --key: clamp(3.2rem, 15vw, 4.4rem);
        --key-gap: 0.4rem;
        --edge: clamp(0.6rem, 3vw, 1.4rem);
        --floor: calc(0.9rem + env(safe-area-inset-bottom));
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #bfe3f2;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .hud {
        position: fixed;
        inset: auto 0 0 0;
        /* Cleared over the arrows, at the height they take when the full
           cross is out. Held constant rather than following the shape, so the
           hint does not hop up and down as a child walks between places. */
        padding: 0.9rem clamp(0.8rem, 3vw, 2rem)
          calc(var(--floor) + var(--key) * 2 + var(--key-gap) + 0.5rem);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        pointer-events: none;
      }
      /* The two corner buttons: your unicorn top left, the sound top right.
         They are up here rather than in the bar along the bottom because they
         are the controls a child reaches for while not doing anything else,
         and down there they crowded the hint line and sat under a thumb
         during play. Both are round, the same size, and wordless. */
      .hud-corner {
        position: fixed;
        top: calc(0.7rem + env(safe-area-inset-top));
        width: 3.4rem;
        height: 3.4rem;
        padding: 0;
        display: grid;
        place-items: center;
        font-size: 1.4rem;
        line-height: 1;
        border: 3px solid var(--ink);
        border-radius: 50%;
        background: #ffe07a;
        box-shadow: 0 4px 0 rgba(74, 51, 39, 0.2);
        cursor: pointer;
        overflow: hidden;
        pointer-events: auto;
        transition: transform 0.12s ease, background 0.12s ease;
        z-index: 5;
      }
      .hud-corner[hidden] {
        display: none;
      }
      .hud-corner:active {
        transform: translateY(2px) scale(0.97);
      }
      .hud-corner:focus-visible {
        outline: 3px solid #2f6fb5;
        outline-offset: 3px;
      }
      .hud-corner-left {
        left: var(--edge);
        padding: 0.18rem;
      }
      .hud-corner-left img {
        /* Whole and centred: the head is taller than it is wide, so letting it
           fill the circle cropped the horn off the top and the mane off the
           side, which is most of what makes it a unicorn. */
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .hud-corner-left:hover {
        background: #ffd147;
      }
      .hud-corner-right {
        right: var(--edge);
        background: #cfe9dd;
      }
      .hud-corner-right:hover {
        background: #b9e0cf;
      }
      .hud-corner-right.off {
        background: #ded8d2;
        opacity: 0.75;
      }
      /* Magic, down in the other bottom corner from the arrows: one thumb
         steers and the other casts, which is the way a child holds a tablet
         anyway. Sized to match an arrow so the bottom row looks deliberate. */
      .hud-corner-magic {
        top: auto;
        bottom: var(--floor);
        right: var(--edge);
        width: var(--key);
        height: var(--key);
        font-size: 1.6rem;
        background: #ffd9f0;
      }
      .hud-corner-magic:hover {
        background: #ffc2e6;
      }
      /* The arrows. Big, close together and always in the same place, because
         a child who has to look for a control has already stopped playing. */
      .pad {
        position: fixed;
        left: 0;
        right: 0;
        bottom: var(--floor);
        height: calc(var(--key) * 2 + var(--key-gap));
        pointer-events: none;
        z-index: 5;
      }
      .pad[hidden] {
        display: none;
      }
      .pad-key {
        position: absolute;
        width: var(--key);
        height: var(--key);
        display: grid;
        place-items: center;
        padding: 0;
        font-size: calc(var(--key) * 0.42);
        line-height: 1;
        color: var(--ink);
        border: 3px solid var(--ink);
        border-radius: 30%;
        background: rgba(255, 250, 240, 0.82);
        box-shadow: 0 4px 0 rgba(74, 51, 39, 0.22);
        cursor: pointer;
        pointer-events: auto;
        touch-action: none;
        transition: transform 0.08s ease, background 0.08s ease;
      }
      .pad-key.down {
        background: #ffe07a;
        transform: translateY(3px) scale(0.96);
        box-shadow: 0 1px 0 rgba(74, 51, 39, 0.22);
      }
      .pad-key:focus-visible {
        outline: 3px solid #2f6fb5;
        outline-offset: 3px;
      }
      /* The meadow: walk any way, so a T of four in the bottom left. */
      .pad[data-shape='walk'] .pad-up {
        left: calc(var(--edge) + var(--key) + var(--key-gap));
        bottom: calc(var(--key) + var(--key-gap));
      }
      .pad[data-shape='walk'] .pad-left {
        left: var(--edge);
        bottom: 0;
      }
      .pad[data-shape='walk'] .pad-down {
        left: calc(var(--edge) + var(--key) + var(--key-gap));
        bottom: 0;
      }
      .pad[data-shape='walk'] .pad-right {
        left: calc(var(--edge) + (var(--key) + var(--key-gap)) * 2);
        bottom: 0;
      }
      /* The yard and the track only ever ask for left or right, so they get
         one under each thumb rather than two side by side under one. */
      .pad[data-shape='sides'] .pad-up,
      .pad[data-shape='sides'] .pad-down {
        display: none;
      }
      .pad[data-shape='sides'] .pad-left {
        left: var(--edge);
        bottom: 0;
      }
      .pad[data-shape='sides'] .pad-right {
        right: var(--edge);
        bottom: 0;
      }
      /* Starting lights, across the top where they cannot be missed. */
      .hud-lights {
        position: fixed;
        top: calc(0.9rem + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 0.55rem;
        padding: 0.45rem 0.65rem;
        background: rgba(46, 38, 33, 0.85);
        border: 3px solid var(--ink);
        border-radius: 999px;
        box-shadow: 0 6px 0 rgba(74, 51, 39, 0.25);
        pointer-events: none;
        z-index: 6;
      }
      .hud-lights[hidden] {
        display: none;
      }
      .hud-light {
        width: clamp(1.5rem, 6vw, 2.1rem);
        height: clamp(1.5rem, 6vw, 2.1rem);
        border-radius: 50%;
        border: 3px solid rgba(0, 0, 0, 0.3);
        background: #2c2622;
        transition: background 90ms linear, box-shadow 90ms linear;
      }
      .hud-light-red.lit {
        background: #ff5548;
        box-shadow: 0 0 14px 4px rgba(255, 85, 72, 0.7);
      }
      .hud-light-amber.lit {
        background: #ffc23d;
        box-shadow: 0 0 14px 4px rgba(255, 194, 61, 0.7);
      }
      .hud-light-green.lit {
        background: #53e070;
        box-shadow: 0 0 18px 6px rgba(83, 224, 112, 0.75);
      }
      /* The one big word: the countdown, and "Kör!" as the flag drops. Sized
         off the screen width so it is the same handful of characters filling
         the same share of a phone and of a laptop. Cream on a thick brown
         outline, which is the only way white text stays readable over both
         grey tarmac and bright green grass. */
      .hud-shout {
        position: fixed;
        /* Above the middle: clear of the lap board in the top left, clear of
           the kart in the centre, and clear of the arrows at the bottom. */
        top: 30%;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        font-size: clamp(3rem, 17vw, 7rem);
        font-weight: bold;
        line-height: 1;
        white-space: nowrap;
        text-transform: uppercase;
        color: #fffaf0;
        -webkit-text-stroke: 0.12em var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 0.06em 0 rgba(74, 51, 39, 0.35);
        pointer-events: none;
        z-index: 7;
      }
      .hud-shout[hidden] {
        display: none;
      }
      .hud-shout.pop {
        animation: shout-pop 0.45s cubic-bezier(0.2, 1.5, 0.4, 1);
      }
      @keyframes shout-pop {
        0% {
          transform: translateX(-50%) scale(0.4);
          opacity: 0;
        }
        60% {
          transform: translateX(-50%) scale(1.12);
          opacity: 1;
        }
      }
      /* Lap and placing, down the left. Big enough to read out of the corner
         of an eye at speed, which is the only way it gets read at all. */
      .hud-board {
        position: fixed;
        /* Below the row the corner buttons and the starting lights live in,
           rather than in the corner itself. The lights are centred and grow
           with the screen, so anything sharing that row with them is one
           narrow phone away from being sat on. */
        top: calc(4.6rem + env(safe-area-inset-top));
        left: clamp(0.6rem, 3vw, 1.4rem);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        line-height: 1;
        color: #fffaf0;
        -webkit-text-stroke: 0.09em var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 0.06em 0 rgba(74, 51, 39, 0.35);
        pointer-events: none;
        z-index: 5;
      }
      .hud-board[hidden] {
        display: none;
      }
      .hud-board-lap {
        font-size: clamp(1.2rem, 6vw, 2.1rem);
        font-weight: bold;
      }
      .hud-board-spot {
        font-size: clamp(2.1rem, 10vw, 3.4rem);
        font-weight: bold;
        text-transform: uppercase;
      }
      .hud-board.leading .hud-board-spot {
        color: #ffd23f;
      }
      .hud-board-lap[hidden],
      .hud-board-spot[hidden] {
        display: none;
      }
      .hud-board-spot.pop {
        animation: spot-pop 0.4s cubic-bezier(0.2, 1.5, 0.4, 1);
      }
      @keyframes spot-pop {
        0% {
          transform: scale(0.6);
        }
        60% {
          transform: scale(1.15);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hud-shout.pop,
        .hud-board-spot.pop {
          animation: none;
        }
      }
      /* The counters, loose across the top rather than in a bar of their own.
         They are the only thing left of the old name card: a child knows what
         their own unicorn is called without being told every frame. */
      .hud-counts {
        position: fixed;
        top: calc(0.9rem + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 0.5rem;
        pointer-events: none;
        z-index: 4;
      }
      .hud-counts[hidden] {
        display: none;
      }
      .hud-tally,
      .hud-friends {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 1.1rem;
        font-weight: bold;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        background: #ffe9c9;
        border: 2px solid var(--ink);
        box-shadow: 0 3px 0 rgba(74, 51, 39, 0.18);
        transition: transform 0.15s ease;
      }
      .hud-friends {
        background: #d9f0ff;
      }
      .hud-tally[hidden],
      .hud-friends[hidden] {
        display: none;
      }
      .hud-tally.pop,
      .hud-friends.pop {
        animation: tally-pop 0.35s ease;
      }
      @keyframes tally-pop {
        40% {
          transform: scale(1.28) rotate(-4deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hud-tally.pop {
          animation: none;
        }
      }
      .hud-hint {
        margin: 0;
        font-size: 0.9rem;
        font-weight: bold;
        color: #3f5d4f;
        background: rgba(255, 255, 255, 0.72);
        padding: 0.3rem 0.9rem;
        border-radius: 999px;
        transition: opacity 0.6s ease;
      }
      .hud-hint.gone {
        opacity: 0;
      }
      .spell {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: rgba(40, 62, 54, 0.55);
        backdrop-filter: blur(3px);
        padding: 1rem;
      }
      .spell[hidden] {
        display: none;
      }
      .spell-panel {
        position: relative;
        background: linear-gradient(#fffaf2, #f2f7ef);
        border: 4px solid var(--ink);
        border-radius: 1.6rem;
        box-shadow: 0 10px 0 rgba(74, 51, 39, 0.22);
        padding: 1.2rem clamp(1rem, 4vw, 2rem) 1.4rem;
        max-width: min(94vw, 40rem);
        max-height: 94vh;
        overflow: auto;
        text-align: center;
      }
      .spell-close {
        position: absolute;
        top: 0.6rem;
        right: 0.6rem;
        width: 2.6rem;
        height: 2.6rem;
        font: inherit;
        font-size: 1.1rem;
        color: var(--ink);
        background: #ffd9e0;
        border: 3px solid var(--ink);
        border-radius: 50%;
        cursor: pointer;
      }
      .spell-title {
        margin: 0.2rem 0 0.9rem;
        font-size: clamp(1.3rem, 4vw, 1.8rem);
      }
      .spell-picker {
        display: flex;
        flex-wrap: wrap;
        gap: 0.9rem;
        justify-content: center;
      }
      /* `hidden` alone loses to `display: flex`, so it has to be spelled out. */
      .spell-picker[hidden] {
        display: none;
      }
      .spell-card {
        font: inherit;
        color: var(--ink);
        width: min(15rem, 40vw);
        display: grid;
        gap: 0.3rem;
        padding: 1rem 0.8rem;
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 1.1rem;
        cursor: pointer;
        transition: transform 0.12s ease, background 0.12s ease;
      }
      .spell-card:hover {
        background: #fff3d6;
        transform: translateY(-2px);
      }
      .spell-card:active {
        transform: translateY(2px) scale(0.98);
      }
      .spell-card-icon {
        font-size: 2.6rem;
        line-height: 1;
      }
      .spell-card-name {
        font-weight: bold;
        font-size: 1.15rem;
      }
      .spell-card-desc {
        font-size: 0.85rem;
        color: #5d6f63;
      }
      .spell-canvas {
        width: min(70vw, 52vh);
        height: min(70vw, 52vh);
        touch-action: none;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.7);
        border: 3px dashed rgba(74, 51, 39, 0.25);
        cursor: crosshair;
      }
      .spell-draw.shake {
        animation: spell-shake 0.4s ease;
      }
      .spell-draw.cast .spell-canvas {
        animation: spell-cast 0.5s ease forwards;
      }
      @keyframes spell-shake {
        20% { transform: translateX(-10px); }
        45% { transform: translateX(9px); }
        70% { transform: translateX(-5px); }
      }
      @keyframes spell-cast {
        to {
          transform: scale(1.12);
          opacity: 0;
        }
      }
      .spell-status {
        margin: 0.9rem 0 0;
        min-height: 1.4rem;
        font-weight: bold;
        font-size: 1.05rem;
      }
      @media (prefers-reduced-motion: reduce) {
        .spell-draw.shake,
        .spell-draw.cast .spell-canvas {
          animation: none;
        }
      }
      .wardrobe {
        position: fixed;
        inset: 0;
        z-index: 25;
        display: grid;
        place-items: center;
        background: rgba(40, 62, 54, 0.55);
        backdrop-filter: blur(3px);
        padding: 0.6rem;
      }
      .wardrobe[hidden] {
        display: none;
      }
      .wardrobe-panel {
        display: flex;
        gap: 1rem;
        align-items: stretch;
        background: linear-gradient(#fffaf2, #f2f7ef);
        border: 4px solid var(--ink);
        border-radius: 1.6rem;
        box-shadow: 0 10px 0 rgba(74, 51, 39, 0.22);
        padding: 1rem;
        max-width: min(96vw, 56rem);
        max-height: 96vh;
      }
      .wardrobe-stage {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        align-items: center;
        flex: 0 0 auto;
      }
      /* The size is set in JS, deliberately — see Preview.resize in
         wardrobe.ts. A canvas whose CSS size and whose drawing buffer can
         disagree will grow without bound if the buffer is ever derived from
         the rendered size, so exactly one of the two is in charge. */
      .wardrobe-canvas {
        background: radial-gradient(circle at 50% 62%, #dff0e4, #bfe3f2);
        border: 3px solid var(--ink);
        border-radius: 1.1rem;
      }
      .wardrobe-namerow {
        display: flex;
        gap: 0.4rem;
        align-items: center;
      }
      .wardrobe-name {
        font: inherit;
        font-weight: bold;
        font-size: 1rem;
        color: var(--ink);
        width: 7.5rem;
        text-align: center;
        padding: 0.45rem 0.5rem;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: #fff;
      }
      .wardrobe-dice {
        font-size: 1.2rem;
        width: 2.7rem;
        height: 2.7rem;
        border: 3px solid var(--ink);
        border-radius: 50%;
        background: #ffe07a;
        cursor: pointer;
      }
      .wardrobe-done {
        font: inherit;
        font-weight: bold;
        font-size: 1.15rem;
        color: var(--ink);
        width: 100%;
        padding: 0.6rem 1rem;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: #8fe0c0;
        cursor: pointer;
      }
      .wardrobe-done:active,
      .wardrobe-dice:active {
        transform: translateY(2px) scale(0.98);
      }
      .wardrobe-picker {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        min-width: 0;
        flex: 1 1 auto;
      }
      .wardrobe-tabs {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
      }
      .wardrobe-tab {
        font: inherit;
        font-size: 0.85rem;
        font-weight: bold;
        color: var(--ink);
        display: grid;
        justify-items: center;
        gap: 0.1rem;
        padding: 0.4rem 0.7rem;
        border: 3px solid var(--ink);
        border-radius: 0.9rem;
        background: #fff;
        cursor: pointer;
      }
      .wardrobe-tab span:first-child {
        font-size: 1.2rem;
        line-height: 1;
      }
      .wardrobe-tab.active {
        background: #ffe07a;
      }
      .wardrobe-options {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(5.2rem, 1fr));
        gap: 0.5rem;
        overflow-y: auto;
        padding: 0.2rem;
        min-height: 6rem;
        max-height: min(38vh, 16rem);
      }
      .wardrobe-option {
        font: inherit;
        font-size: 0.75rem;
        font-weight: bold;
        color: var(--ink);
        display: grid;
        justify-items: center;
        gap: 0.2rem;
        padding: 0.4rem 0.2rem;
        background: #fff;
        border: 3px solid rgba(74, 51, 39, 0.25);
        border-radius: 0.8rem;
        cursor: pointer;
      }
      .wardrobe-option img {
        width: 3.2rem;
        height: 3.2rem;
        object-fit: contain;
      }
      .wardrobe-none {
        font-size: 2rem;
        line-height: 3.2rem;
        height: 3.2rem;
        color: rgba(74, 51, 39, 0.4);
      }
      .wardrobe-option.selected {
        border-color: var(--ink);
        background: #fff3d6;
      }
      .wardrobe-swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        justify-content: center;
      }
      .wardrobe-swatch {
        width: 2.2rem;
        height: 2.2rem;
        border: 3px solid rgba(74, 51, 39, 0.3);
        border-radius: 50%;
        cursor: pointer;
        padding: 0;
      }
      .wardrobe-swatch.selected {
        border-color: var(--ink);
        transform: scale(1.14);
      }
      /* Narrow screens stack the stage above the shelves. */
      @media (max-width: 40rem), (orientation: portrait) {
        .wardrobe-panel {
          flex-direction: column;
          gap: 0.6rem;
          overflow-y: auto;
        }
      }
      .spelling {
        position: fixed;
        inset: 0;
        z-index: 22;
        display: grid;
        place-items: center;
        background: rgba(40, 62, 54, 0.55);
        backdrop-filter: blur(3px);
        padding: 0.6rem;
      }
      .spelling[hidden] {
        display: none;
      }
      .spelling-panel {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7rem;
        background: linear-gradient(#fffaf2, #f2f7ef);
        border: 4px solid var(--ink);
        border-radius: 1.6rem;
        box-shadow: 0 10px 0 rgba(74, 51, 39, 0.22);
        padding: 1rem clamp(0.8rem, 3vw, 2rem) 1.2rem;
        max-width: min(96vw, 46rem);
        max-height: 96vh;
        overflow-y: auto;
      }
      .spelling-close {
        position: absolute;
        top: 0.6rem;
        right: 0.6rem;
        width: 2.6rem;
        height: 2.6rem;
        font: inherit;
        font-size: 1.1rem;
        color: var(--ink);
        background: #ffd9e0;
        border: 3px solid var(--ink);
        border-radius: 50%;
        cursor: pointer;
      }
      .spelling-levels {
        display: flex;
        gap: 0.4rem;
      }
      .spelling-level {
        font: inherit;
        font-size: 0.8rem;
        font-weight: bold;
        color: var(--ink);
        display: grid;
        justify-items: center;
        padding: 0.35rem 0.7rem;
        border: 3px solid var(--ink);
        border-radius: 0.9rem;
        background: #fff;
        cursor: pointer;
      }
      .spelling-level span:first-child {
        font-size: 1.1rem;
        line-height: 1.2;
      }
      .spelling-level.active {
        background: #ffe07a;
      }
      .spelling-picture {
        width: clamp(6rem, 22vw, 9rem);
        height: clamp(6rem, 22vw, 9rem);
        object-fit: contain;
        background: radial-gradient(circle at 50% 60%, #dff0e4, #cfe9dd);
        border: 3px solid var(--ink);
        border-radius: 1.1rem;
        padding: 0.4rem;
      }
      .spelling-slots,
      .spelling-tray {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        justify-content: center;
        min-height: 3.6rem;
      }
      .spelling-tray {
        padding: 0.5rem;
        border: 3px dashed rgba(74, 51, 39, 0.28);
        border-radius: 1rem;
        min-width: min(80vw, 24rem);
      }
      .spelling-slot {
        min-width: 3rem;
        height: 3.4rem;
        display: grid;
        place-items: center;
        padding: 0 0.15rem;
        border: 3px dashed rgba(74, 51, 39, 0.35);
        border-radius: 0.7rem;
        background: rgba(255, 255, 255, 0.6);
      }
      .spelling-slot.given {
        border-style: solid;
        background: #eef4ec;
      }
      .spelling-tile {
        font: inherit;
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--ink);
        min-width: 2.6rem;
        height: 3rem;
        padding: 0 0.5rem;
        display: grid;
        place-items: center;
        background: #ffe07a;
        border: 3px solid var(--ink);
        border-radius: 0.6rem;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      .spelling-tile.fixed {
        background: #cfe9dd;
        cursor: default;
      }
      .spelling-tile.dragging {
        cursor: grabbing;
        z-index: 5;
        position: relative;
        box-shadow: 0 6px 12px rgba(74, 51, 39, 0.3);
      }
      .spelling-gap {
        min-width: 2.6rem;
        height: 3rem;
        border-radius: 0.6rem;
        background: rgba(74, 51, 39, 0.06);
      }
      .spelling-slots.shake {
        animation: spell-shake 0.4s ease;
      }
      .spelling-slots.correct .spelling-tile {
        background: #8fe0c0;
      }
      .spelling-slots.correct {
        animation: tally-pop 0.5s ease;
      }
      .spelling-status {
        margin: 0;
        min-height: 1.4rem;
        font-weight: bold;
        text-align: center;
      }
      .spelling-footer {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .spelling-score {
        font-size: 1.2rem;
        font-weight: bold;
      }
      .spelling-next {
        font: inherit;
        font-weight: bold;
        color: var(--ink);
        padding: 0.5rem 1.1rem;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: #8fe0c0;
        cursor: pointer;
      }
      @media (prefers-reduced-motion: reduce) {
        .spelling-slots.shake,
        .spelling-slots.correct {
          animation: none;
        }
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.2rem;
        background: linear-gradient(#bfe3f2, #dff0e4);
        z-index: 10;
        transition: opacity 0.5s ease;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading .horn {
        font-size: 4rem;
        animation: bob 1.4s ease-in-out infinite;
      }
      #loading p {
        margin: 0;
        font-size: 1.4rem;
        font-weight: bold;
        letter-spacing: 0.02em;
      }
      #loading .bar {
        width: min(60vw, 18rem);
        height: 0.9rem;
        border: 3px solid var(--ink);
        border-radius: 999px;
        overflow: hidden;
        background: #fff;
      }
      #loading .bar span {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #ff9ec7, #ffd479, #8fe0c0, #9ec8ff);
        transition: width 0.25s ease;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0) rotate(-6deg);
        }
        50% {
          transform: translateY(-12px) rotate(6deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .horn {
          animation: none;
        }
      }

      /* --- the drawing board ------------------------------------------- */
      .board {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: rgba(40, 62, 54, 0.55);
        backdrop-filter: blur(3px);
        padding: 0.6rem;
      }
      .board[hidden] {
        display: none;
      }
      .board-panel {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        width: min(96vw, 60rem);
        max-height: 96vh;
      }
      .board-sheet {
        background: #fffdf8;
        border: 5px solid var(--ink);
        border-radius: 1rem;
        box-shadow: 0 8px 0 rgba(74, 51, 39, 0.22);
        overflow: hidden;
        /* Matches the easel's own board, so what is drawn is what hangs in the
           meadow — no letterboxing and nothing stretched. */
        aspect-ratio: 900 / 882;
        min-height: 0;
      }
      .board-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
      }
      .board-canvas.rubbing {
        cursor: cell;
      }
      .board-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background: linear-gradient(#fffaf2, #f2f7ef);
        border: 4px solid var(--ink);
        border-radius: 1.2rem;
        box-shadow: 0 6px 0 rgba(74, 51, 39, 0.2);
        padding: 0.5rem 0.7rem;
      }
      .board-crayons,
      .board-nibs {
        display: flex;
        gap: 0.35rem;
      }
      .board-crayon {
        width: 2.2rem;
        height: 2.2rem;
        border-radius: 50%;
        border: 3px solid var(--ink);
        background: var(--crayon);
        cursor: pointer;
        padding: 0;
      }
      .board-crayon.on {
        outline: 4px solid #ffc44a;
        outline-offset: 2px;
        transform: translateY(-3px);
      }
      .board-nib {
        width: 2.2rem;
        height: 2.2rem;
        display: grid;
        place-items: center;
        border-radius: 0.7rem;
        border: 3px solid var(--ink);
        background: #fffdf8;
        cursor: pointer;
        padding: 0;
      }
      .board-nib span {
        display: block;
        border-radius: 50%;
        background: var(--ink);
      }
      .board-nib.on,
      .board-tool.on {
        background: #ffe9a8;
        outline: 4px solid #ffc44a;
        outline-offset: 2px;
      }
      .board-tool {
        width: 2.6rem;
        height: 2.4rem;
        font-size: 1.2rem;
        line-height: 1;
        border-radius: 0.7rem;
        border: 3px solid var(--ink);
        background: #fffdf8;
        cursor: pointer;
        padding: 0;
      }
      .board-close {
        position: absolute;
        top: -0.5rem;
        right: -0.5rem;
        z-index: 1;
        width: 2.6rem;
        height: 2.6rem;
        border-radius: 50%;
        border: 4px solid var(--ink);
        background: #ffd9e2;
        font-size: 1.1rem;
        font-weight: 800;
        color: var(--ink);
        cursor: pointer;
      }
      /* Standing up, the crayons go down the side and the sheet gets the rest. */
      @media (orientation: portrait) {
        .board-tools {
          gap: 0.35rem;
          padding: 0.4rem 0.5rem;
        }
        .board-crayon,
        .board-nib {
          width: 1.9rem;
          height: 1.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">
      <div class="horn">🦄</div>
      <p>Ängen växer fram…</p>
      <div class="bar"><span id="loading-bar"></span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
